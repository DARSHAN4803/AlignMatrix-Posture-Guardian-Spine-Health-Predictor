<!DOCTYPE html>
<html>
<head>
    <title>Live Posture Detection</title>

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 0;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-bottom: 25px;
            color: #2c3e50;
        }

        .video-container {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .video-container img {
            width: 900px;
            max-width: 100%;
            border-radius: 12px;
            border: 3px solid #2c3e50;
        }

        .stop-btn {
            background: linear-gradient(135deg, #ff4d4d, #cc0000);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .stop-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .stop-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">

        <h2>Posture Guardian - Live Detection</h2>

        <div class="video-container">
            <img src="{{ url_for('video_feed') }}">
        </div>

        <a href="{{ url_for('stop_camera') }}">
            <button class="stop-btn">
                Stop Detection
            </button>
        </a>

    </div>

</body>
</html>
